<svg width="720" height="200" viewBox="0 0 720 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DraftScripts — Modern web studio">
  <defs>
    <linearGradient id="ds-bg" x1="40" y1="40" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34D399"/>
      <stop offset="0.55" stop-color="#059669"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="ds-sheen" x1="100" y1="40" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ds-word" x1="430" y1="60" x2="700" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#059669"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
  </defs>

  <!-- card -->
  <rect width="720" height="200" rx="36" fill="#ffffff"/>

  <!-- mark -->
  <rect x="40" y="40" width="120" height="120" rx="34" fill="url(#ds-bg)"/>
  <rect x="40" y="40" width="120" height="120" rx="34" fill="url(#ds-sheen)"/>
  <rect x="40.75" y="40.75" width="118.5" height="118.5" rx="33.25" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
  <g fill="none" stroke="#ffffff" stroke-width="7.9" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M62.5 83.1 73.75 100 62.5 116.9"/>
    <path d="M124.4 116.9H137.5"/>
  </g>
  <text x="100" y="101.5" text-anchor="middle" dominant-baseline="central"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="47" font-weight="800" letter-spacing="-2" fill="#ffffff">DS</text>

  <!-- wordmark -->
  <text x="194" y="100" dominant-baseline="central"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="74" font-weight="800" letter-spacing="-2.5">
    <tspan fill="#0B1220">Draft</tspan><tspan fill="url(#ds-word)">Scripts</tspan>
  </text>
  <text x="196" y="150"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="22" font-weight="500" letter-spacing="3" fill="#64748B">MODERN WEB STUDIO</text>
</svg>
